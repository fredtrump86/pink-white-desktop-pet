name: Build and release Windows desktop pet

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - installer.iss
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read version and check existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $ErrorActionPreference = "Stop"
          $scriptText = [IO.File]::ReadAllText("installer.iss", [Text.Encoding]::UTF8)
          $versionMatch = [regex]::Match($scriptText, '#define MyAppVersion "([0-9]+\.[0-9]+\.[0-9]+)"')
          if (-not $versionMatch.Success) { throw "无法读取安装包版本号" }
          $tag = "v" + $versionMatch.Groups[1].Value
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $releaseJson = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw "查询 Release 列表失败" }
          $pages = ConvertFrom-Json -InputObject ($releaseJson -join "`n") -NoEnumerate
          $matching = @(foreach ($page in $pages) { foreach ($item in $page) { if ($item.tag_name -eq $tag) { $item } } })
          if ($matching.Count -gt 1) { throw "同版本存在多个发布记录，请先检查" }
          if ($matching.Count -eq 1 -and -not $matching[0].draft) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Output "$tag 已发布，保留现有附件，不重复发布。"
          } else {
            if ($matching.Count -eq 1) {
              $draft = $matching[0]
              if ($draft.author.login -ne "github-actions[bot]" -or $draft.name -ne "粉白桌宠 $tag" -or $draft.body -notmatch '本版本由 GitHub Actions 从对应提交构建') {
                throw "同版本草稿不是本工作流创建的，请先检查草稿"
              }
              "draft_id=$($draft.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            }
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Set up Python
        if: steps.version.outputs.exists == 'false'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install dependencies
        if: steps.version.outputs.exists == 'false'
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $ErrorActionPreference = "Stop"
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "创建虚拟环境失败" }
          & ".venv/Scripts/python.exe" -m pip install -r "requirements.txt"
          if ($LASTEXITCODE -ne 0) { throw "安装依赖失败" }

      - name: Run unit tests
        if: steps.version.outputs.exists == 'false'
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          & ".venv/Scripts/python.exe" -B -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "单元测试失败" }

      - name: Build portable executable and installer
        if: steps.version.outputs.exists == 'false'
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $ErrorActionPreference = "Stop"
          & "./build.ps1"
          foreach ($name in @("粉白桌宠.exe", "粉白桌宠安装包.exe")) {
            if (-not (Test-Path -LiteralPath "dist/$name")) { throw "缺少构建产物：$name" }
          }

      - name: Check packaged resources and generate checksums
        if: steps.version.outputs.exists == 'false'
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $ErrorActionPreference = "Stop"
          $executable = (Resolve-Path -LiteralPath "dist/粉白桌宠.exe").Path
          $checkProcess = Start-Process -FilePath $executable -ArgumentList "--check" -WindowStyle Hidden -Wait -PassThru
          if ($checkProcess.ExitCode -ne 0) { throw "打包后的资源自检失败" }
          Copy-Item -LiteralPath "dist/粉白桌宠.exe" -Destination "dist/pink-white-desktop-pet.exe"
          Copy-Item -LiteralPath "dist/粉白桌宠安装包.exe" -Destination "dist/pink-white-desktop-pet-setup.exe"
          $checksumLines = foreach ($name in @("pink-white-desktop-pet.exe", "pink-white-desktop-pet-setup.exe")) {
            $hash = (Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          [IO.File]::WriteAllLines("dist/SHA256SUMS.txt", [string[]]$checksumLines, [Text.UTF8Encoding]::new($false))

      - name: Upload and publish release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          DRAFT_RELEASE_ID: ${{ steps.version.outputs.draft_id }}
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $ErrorActionPreference = "Stop"
          $notes = @'
          我的第一个 Vibe Coding 作品：粉白桌宠。

          ## 下载与使用
          - pink-white-desktop-pet.exe：便携版，下载后双击运行，无需安装 Python。
          - pink-white-desktop-pet-setup.exe：安装版，提供快捷方式与卸载程序。
          - SHA256SUMS.txt：两个安装文件的 SHA-256 校验值。

          ## 功能
          - 透明置顶、拖动与位置记忆、系统托盘及尺寸调整。
          - 点击、双击和悬停互动，11 种角色状态及对话气泡。
          - 带随机等待和长时间未互动休息规则的自动动作。

          ## 验证范围
          本版本由 GitHub Actions 从对应提交构建，发布前执行单元测试、源码资源自检和打包后的资源自检。
          面向 Windows x64 兼容环境；资源自检不代替真实桌面交互、安装与卸载验收。
          '@
          [IO.File]::WriteAllText("dist/RELEASE_NOTES.md", $notes, [Text.UTF8Encoding]::new($false))
          if ($env:DRAFT_RELEASE_ID) {
            $draftId = [long]$env:DRAFT_RELEASE_ID
            $draftJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/$draftId"
            if ($LASTEXITCODE -ne 0) { throw "读取待恢复草稿失败" }
            $existingDraft = ($draftJson -join "`n") | ConvertFrom-Json
            if (-not $existingDraft.draft -or $existingDraft.author.login -ne "github-actions[bot]" -or $existingDraft.tag_name -ne $env:RELEASE_TAG -or $existingDraft.body -notmatch '本版本由 GitHub Actions 从对应提交构建') {
              throw "草稿状态已变化，停止恢复"
            }
            gh release edit $env:RELEASE_TAG --target $env:GITHUB_SHA --title "粉白桌宠 $env:RELEASE_TAG" --notes-file "dist/RELEASE_NOTES.md"
            if ($LASTEXITCODE -ne 0) { throw "更新发布草稿失败" }
          } else {
            gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --title "粉白桌宠 $env:RELEASE_TAG" --notes-file "dist/RELEASE_NOTES.md" --draft
            if ($LASTEXITCODE -ne 0) { throw "创建发布草稿失败" }
            $allReleases = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
            if ($LASTEXITCODE -ne 0) { throw "查询新建草稿失败" }
            $pages = ConvertFrom-Json -InputObject ($allReleases -join "`n") -NoEnumerate
            $created = @(foreach ($page in $pages) { foreach ($item in $page) { if ($item.tag_name -eq $env:RELEASE_TAG -and $item.draft) { $item } } })
            if ($created.Count -ne 1) { throw "无法唯一确定新建草稿" }
            $draftId = [long]$created[0].id
          }
          gh release upload $env:RELEASE_TAG "dist/pink-white-desktop-pet.exe" "dist/pink-white-desktop-pet-setup.exe" "dist/SHA256SUMS.txt" --clobber
          if ($LASTEXITCODE -ne 0) { throw "上传发布附件失败，保留草稿供重试" }
          $draftJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/$draftId"
          if ($LASTEXITCODE -ne 0) { throw "读取发布草稿失败" }
          $draft = ($draftJson -join "`n") | ConvertFrom-Json
          foreach ($legacyAsset in @($draft.assets | Where-Object { $_.name -eq "default.exe" })) {
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($legacyAsset.id)"
            if ($LASTEXITCODE -ne 0) { throw "清理本工作流产生的无效草稿附件失败" }
          }
          $draftJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/$draftId"
          if ($LASTEXITCODE -ne 0) { throw "重新读取发布草稿失败" }
          $draft = ($draftJson -join "`n") | ConvertFrom-Json
          if (-not $draft.draft -or $draft.assets.Count -ne 3) { throw "草稿状态或附件数量异常，停止发布" }
          foreach ($name in @("pink-white-desktop-pet.exe", "pink-white-desktop-pet-setup.exe", "SHA256SUMS.txt")) {
            $asset = @($draft.assets | Where-Object { $_.name -eq $name })
            $localSize = (Get-Item -LiteralPath "dist/$name").Length
            if ($asset.Count -ne 1 -or $asset[0].state -ne "uploaded" -or $asset[0].size -ne $localSize) {
              throw "发布附件校验失败：$name；保留草稿供检查"
            }
            $expectedDigest = "sha256:" + (Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset[0].digest -and $asset[0].digest -ne $expectedDigest) { throw "发布附件摘要不一致：$name" }
          }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "公开发布失败，草稿已保留" }
